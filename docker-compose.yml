services:
  postgres:
    image: postgres:16-alpine
    container_name: flowcrm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowcrm
      POSTGRES_PASSWORD: flowcrm_secret
      POSTGRES_DB: flowcrm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcrm -d flowcrm_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
